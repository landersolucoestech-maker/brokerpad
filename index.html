<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrokerPad</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7f9;color:#1f2937}
    .boot{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
    .boot strong{font-size:20px}.boot small{color:#667085}.bar{width:240px;height:4px;border-radius:999px;background:#e5e7eb;overflow:hidden}
    .bar:before{content:"";display:block;height:100%;width:35%;background:#0f6b67;animation:load 1s ease-in-out infinite alternate}
    @keyframes load{to{transform:translateX(190%)}}
    .error{max-width:720px;padding:24px;color:#991b1b;white-space:pre-wrap}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div class="boot" id="boot"><strong>BrokerPad</strong><div class="bar"></div><small>Loading application…</small></div>
  <script>
  (async function () {
    try {
      if (!window.JSZip) throw new Error('JSZip failed to load.');
      const urls = Array.from({length:20}, (_, i) => `bootstrap/source/part-${String(i).padStart(2,'0')}.b64`);
      const parts = await Promise.all(urls.map(async url => {
        const response = await fetch(url, {cache:'no-store'});
        if (!response.ok) throw new Error(`Failed to load ${url}: HTTP ${response.status}`);
        return (await response.text()).trim();
      }));
      const binary = atob(parts.join(''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const zip = await JSZip.loadAsync(bytes);
      const source = zip.file('brokerpad-benchmark-consolidated/index.html');
      if (!source) throw new Error('BrokerPad index.html was not found in the verified source archive.');
      const sourceHtml = await source.async('text');
      const html = sourceHtml
        .replace('</head>', '<link rel="stylesheet" href="src/runtime/app.css"><link rel="stylesheet" href="src/runtime/design-system.css"></head>')
        .replace('</body>', '<script src="src/runtime/app.js"><\/script><script src="src/runtime/modules/customers.js"><\/script><script src="src/runtime/modules/leads.js"><\/script><script src="src/runtime/modules/quotes.js"><\/script><script src="src/runtime/modules/orders.js"><\/script><script src="src/runtime/modules/carriers.js"><\/script><script src="src/runtime/modules/dispatch.js"><\/script><script src="src/runtime/modules/compliance.js"><\/script><script src="src/runtime/modules/finance.js"><\/script><script src="src/runtime/modules/risk.js"><\/script><script src="src/runtime/modules/documents.js"><\/script><script src="src/runtime/modules/communications.js"><\/script><script src="src/runtime/modules/reports.js"><\/script><script src="src/runtime/modules/sync.js"><\/script><script src="src/runtime/modules/audit.js"><\/script><script src="src/runtime/ui-system.js"><\/script></body>');
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      document.body.innerHTML = `<div class="boot"><div class="error"><strong>BrokerPad could not be loaded.</strong><br><br>${String(error && error.stack || error)}</div></div>`;
      console.error(error);
    }
  })();
  </script>
</body>
</html>
