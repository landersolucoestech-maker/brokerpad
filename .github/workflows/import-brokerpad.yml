name: Import BrokerPad source

on:
  push:
    branches:
      - dev
    paths:
      - 'bootstrap/source/**'
      - '.github/workflows/import-brokerpad.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Reconstruct and verify uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source/part-*.b64 > /tmp/brokerpad.b64
          base64 --decode /tmp/brokerpad.b64 > /tmp/brokerpad.zip
          echo '72f9a60244b43940fdc89462c4f011d0ffbd961d47e1cfe10f41c089e15d0ea6  /tmp/brokerpad.zip' | sha256sum --check --strict
          rm -rf /tmp/brokerpad-extracted
          mkdir -p /tmp/brokerpad-extracted
          unzip -q /tmp/brokerpad.zip -d /tmp/brokerpad-extracted
          test -f /tmp/brokerpad-extracted/brokerpad-benchmark-consolidated/index.html
          test -f /tmp/brokerpad-extracted/brokerpad-benchmark-consolidated/BENCHMARK_IMPLEMENTATION.md
          test -f /tmp/brokerpad-extracted/brokerpad-benchmark-consolidated/VERIFICATION.md
          echo '4f32fe3717b3d7128cddc4f52368e667c8cfe2fcf093173ab61fee47fc1691f6  /tmp/brokerpad-extracted/brokerpad-benchmark-consolidated/index.html' | sha256sum --check --strict
          echo 'dd27a232f238fc63c2e97a901d76d9be6cd9cbe09ddfd8bd3d80ebc38bb9a9f8  /tmp/brokerpad-extracted/brokerpad-benchmark-consolidated/BENCHMARK_IMPLEMENTATION.md' | sha256sum --check --strict
          echo 'fe86cb811b86986fec1b08d2e865f8203512c087185b75c9fed390af4dc1e717  /tmp/brokerpad-extracted/brokerpad-benchmark-consolidated/VERIFICATION.md' | sha256sum --check --strict

      - name: Install project files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/brokerpad-extracted/brokerpad-benchmark-consolidated/index.html ./index.html
          cp /tmp/brokerpad-extracted/brokerpad-benchmark-consolidated/BENCHMARK_IMPLEMENTATION.md ./BENCHMARK_IMPLEMENTATION.md
          cp /tmp/brokerpad-extracted/brokerpad-benchmark-consolidated/VERIFICATION.md ./VERIFICATION.md
          rm -rf bootstrap

      - name: Commit imported project to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import BrokerPad benchmark consolidated prototype'
          git push origin HEAD:dev
